<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Simulink 휠 마찰 모델 추가 후 측정 성능 특성: 상승시간 3.446초, 정착시간 6.276초, 오버슈트 0퍼센트, 10초 자세오차 0.01896도, 감쇠비 고유진동수 추정값은 -1 표시">
<rect width="900" height="520" rx="14" fill="#16191E"/>
<text x="42" y="51" font-size="26" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700" fill="#F2F5F9">휠 마찰 모델 추가 후 Simulink 출력 특성</text>
<text x="42" y="78" font-size="17" font-family="Arial,'Noto Sans KR',sans-serif" fill="#AAB2BD">X축 5° 계단입력 · 10초 시뮬레이션</text>
<rect x="40" y="101" width="820" height="51" rx="5" fill="#20262D"/>
<text x="60" y="134" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif" fill="#CBD5E1">상승시간 Tr (10–90%)</text>
<text x="837" y="135" font-size="26" text-anchor="end" font-family="Arial,sans-serif" font-weight="700" fill="#F2F5F9">3.446 s</text>
<rect x="40" y="160" width="820" height="51" rx="5" fill="#252B32"/>
<text x="60" y="193" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif" fill="#CBD5E1">정착시간 Ts (±2%)</text>
<text x="837" y="194" font-size="26" text-anchor="end" font-family="Arial,sans-serif" font-weight="700" fill="#F2F5F9">6.276 s</text>
<rect x="40" y="219" width="820" height="51" rx="5" fill="#20262D"/>
<text x="60" y="252" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif" fill="#CBD5E1">최대 오버슈트</text>
<text x="837" y="253" font-size="26" text-anchor="end" font-family="Arial,sans-serif" font-weight="700" fill="#F2F5F9">0 %</text>
<rect x="40" y="278" width="820" height="51" rx="5" fill="#252B32"/>
<text x="60" y="311" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif" fill="#CBD5E1">10초 시점 자세오차</text>
<text x="837" y="312" font-size="26" text-anchor="end" font-family="Arial,sans-serif" font-weight="700" fill="#F2F5F9">0.01896°</text>
<rect x="40" y="337" width="820" height="51" rx="5" fill="#20262D"/>
<text x="60" y="370" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif" fill="#CBD5E1">감쇠비 역추정 표시</text>
<text x="837" y="371" font-size="26" text-anchor="end" font-family="Arial,sans-serif" font-weight="700" fill="#B5BBC5">-1</text>
<rect x="40" y="396" width="820" height="51" rx="5" fill="#252B32"/>
<text x="60" y="429" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif" fill="#CBD5E1">고유진동수 역추정 표시</text>
<text x="837" y="430" font-size="26" text-anchor="end" font-family="Arial,sans-serif" font-weight="700" fill="#B5BBC5">-1</text>
<text x="42" y="489" font-size="16" font-family="Arial,'Noto Sans KR',sans-serif" fill="#AAB2BD">※ -1은 추정 함수의 표시값이며 실제 감쇠비·고유진동수가 아님.</text>
</svg>