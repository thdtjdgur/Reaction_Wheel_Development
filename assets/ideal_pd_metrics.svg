<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 495" role="img" aria-label="Simulink response metrics for ideal PD attitude control"><rect width="760" height="495" rx="18" fill="#0f172a"/><text x="45" y="52" fill="#f8fafc" font-family="Arial" font-size="27" font-weight="bold">Simulation response metrics</text><text x="45" y="79" fill="#94a3b8" font-family="Arial" font-size="16">Ideal torque transfer · ζ = 1 · ωₙ = 1 rad/s · 5° step</text><rect x="42" y="105" width="676" height="53" rx="8" fill="#253247"/><text x="65" y="138" fill="#e2e8f0" font-family="Arial" font-size="19">Rise time (10–90%)</text><text x="691" y="138" text-anchor="end" fill="#7dd3fc" font-family="Arial" font-size="21" font-weight="bold">3.359 s</text><rect x="42" y="165" width="676" height="53" rx="8" fill="#1e293b"/><text x="65" y="198" fill="#e2e8f0" font-family="Arial" font-size="19">Settling time (2%)</text><text x="691" y="198" text-anchor="end" fill="#7dd3fc" font-family="Arial" font-size="21" font-weight="bold">5.835 s</text><rect x="42" y="225" width="676" height="53" rx="8" fill="#253247"/><text x="65" y="258" fill="#e2e8f0" font-family="Arial" font-size="19">Overshoot</text><text x="691" y="258" text-anchor="end" fill="#7dd3fc" font-family="Arial" font-size="21" font-weight="bold">0 %</text><rect x="42" y="285" width="676" height="53" rx="8" fill="#1e293b"/><text x="65" y="318" fill="#e2e8f0" font-family="Arial" font-size="19">Attitude error at end</text><text x="691" y="318" text-anchor="end" fill="#7dd3fc" font-family="Arial" font-size="21" font-weight="bold">0.002498°</text><rect x="42" y="345" width="676" height="53" rx="8" fill="#253247"/><text x="65" y="378" fill="#e2e8f0" font-family="Arial" font-size="19">Damping ratio (design)</text><text x="691" y="378" text-anchor="end" fill="#7dd3fc" font-family="Arial" font-size="21" font-weight="bold">1.0</text><rect x="42" y="405" width="676" height="53" rx="8" fill="#1e293b"/><text x="65" y="438" fill="#e2e8f0" font-family="Arial" font-size="19">Natural frequency (design)</text><text x="691" y="438" text-anchor="end" fill="#7dd3fc" font-family="Arial" font-size="21" font-weight="bold">1.0 rad/s</text><text x="44" y="480" fill="#94a3b8" font-size="12" font-family="Arial">Timing and error: measured in Simulink. ζ and ωₙ: controller design inputs, not identified values.</text></svg>